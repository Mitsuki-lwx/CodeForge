# CodeForge — 多协议 LLM 终端对话客户端
#
# 用法：复制本文件为 config.yaml 并填入你自己的 API 密钥。
#   cp config.example.yaml config.yaml
#
# providers: LLM 服务提供商列表，可配置多项
#   每项字段说明：
#     - name:      可读名称（如 "My Claude"），用于界面显示
#     - protocol:  协议类型，"anthropic" 或 "openai"
#     - model:     模型名（如 "claude-sonnet-4-20250514", "gpt-4o"）
#     - api_key:   API 密钥（必填）
#     - base_url:  自定义端点地址（可选，覆盖协议默认端点）
#     - vendor:    上游厂商（可选，deepseek/openai/anthropic；缺省自动识别）
#     - thinking:  是否开启扩展思考（可选，默认 false，仅 anthropic 协议生效）
#     - context_window: 上下文窗口大小 token（可选，0 走协议默认）
#     - tier:      路由价位标记（可选，cheap=便宜，见 features.router）
#     - model_aliases: 模型别名映射（可选；别名 → 具体模型名）。
#                  让角色 / Skill 用语义档位（haiku/sonnet/opus）声明 model，
#                  而不把厂商模型名写死进角色文件（见 docs/spec_model_resolution.md）。
#                  没配映射的保留别名会**退回主模型并告警**，不会被发出去撞 404。
#                  注意：端点 /models 接口列出的模型**不等于可用**（实测有列出但
#                  返回 404/403 的），配之前先手动调一次确认。
#     - vision:    该模型是否支持**图像输入**（可选，默认 false）。
#                  `browser_screenshot` 会把截图作为图像块回灌给模型 —— 只有多模态
#                  模型能收。**默认关**：多数文本模型（DeepSeek 系等）收到图像块会
#                  直接 400。关着时截图照样落盘、路径照样回报，只是不进上下文（给人看）。

providers:
  - name: "Anthropic"
    protocol: anthropic
    model: "claude-sonnet-4-20250514"
    api_key: "sk-your-api-key"
    # base_url: "https://api.example.com/anthropic"
    # vendor: anthropic
    # thinking: true
    # context_window: 200000

  - name: "OpenAI"
    protocol: openai
    model: "gpt-4o"
    api_key: "sk-your-api-key"
    # base_url: "https://api.example.com/v1"
    # vendor: openai
    # tier: cheap
    # 模型别名：角色 / Skill 声明 `model: haiku` 时实际使用哪个模型。
    # 不配也能跑（别名会退回主模型并告警），只是拿不到"便宜档"的效果。
    # model_aliases:
    #   haiku: "gpt-4o-mini"
    #   sonnet: "gpt-4o"
    #   opus: "gpt-4o"

# ── 可观测性(Logs/Metrics/Traces)──
# 配了 endpoint 才上报外部(此例为自托管 Langfuse OTLP);不配则默认落本地 ~/.codeforge/obs/
observability:
  # endpoint: http://localhost:3000/api/public/otel/v1/traces
  # headers:
  #   # Langfuse 认证（独立 project: Base64(pk-lf-...:sk-lf-...)）
  #   Authorization: Basic <base64(pk-lf-...:sk-lf-...)>

# ── 功能开关 ──
features:
  coordinator_mode: false   # 团队协调器模式
  fork_teammate: false      # fork 子 agent 是否作为队友

  # ── MCP 外部工具 ──
  # 默认只加载**用户级** ~/.codeforge/mcp.json（你自己写的 = 你自己的授权）。
  #
  # ⚠️ 工作区里的 .codeforge/mcp.json 是**仓库带进来的文件**，而 MCP 的 stdio
  #    server 就是"启动一个子进程"。默认加载它 = `git clone 任意仓库 && codeforge`
  #    会在会话启动时、你还没输入任何东西之前执行仓库指定的命令，子进程还能读到
  #    你的环境变量（实测能读到 API key）。这条路径不需要 agent 参与，
  #    也没有审批环节可绕过。
  #
  #    要用项目自带的，显式打开下面这个开关（或设 CODEFORGE_TRUST_PROJECT_MCP=1）。
  #    不开时会在启动提示里**明确告知"已跳过"**，不会静默。
  mcp:
    trust_project: false

  router:                   # 模型路由（默认关；开启后默认两档）
    enabled: false
    judge_prompt: ""        # 自定义复杂度判断指令；空则用内置
    cheap_tier: "cheap"     # 便宜模型的价位标记

  host:                     # 会话宿主（后台跑 run，关掉终端也不影响）
    enabled: false          # true = TUI 作为客户端连 host；默认 false 走原路径
    port: 0                 # 0 = 随机端口；固定端口便于防火墙/脚本对接
    token_file: ""          # ⚠️ 预留字段，**尚未生效**：控制通道凭据始终写在
                            #    .codeforge/host.token（每次启动轮换，0600）。
                            #    配非空值不会改变行为，只会收到一条告警——刻意如此，
                            #    免得你以为凭据已经挪出项目目录而其实没有。
    unattended_policy: deny_all
    # ↑ 无人环境里没有按键的人，`ask` 级工具决策由谁代答：
    #   deny_all    一律拒绝（默认，最保守 —— 代价是 agent 几乎干不了活）
    #   review      **交给一个独立的模型审查逐个判断**（推荐用于真要让 agent 干活时）
    #               比 allow_write 细：按**具体内容**判而不是按类别；高风险操作仍拒、
    #               低风险写操作放行。策略见 core/permissions/reviewer.py::REVIEW_POLICY。
    #               代价：每个 ask 多一次模型调用（走 model_aliases.haiku 那个便宜档）；
    #               审查自身故障/超时一律按拒绝处理（fail-closed）。
    #   allow_write 另放行写文件（按类别，不看内容）
    #   allow_all   全部放行（危险）
    # 只读工具本来就不询问、不受本策略影响；计划确认等交互式工具任何档位都拒。
    # 子 Agent（fork / 队友）继承父的这一档，不会自己升级成全放行。

  # ── 审批审查后端 ──
  # 只在无人值守的 review 档下生效（上面的 unattended_policy: review）。
  #   backend: jev（默认）= 用 Jev（TypeSafe System One）决策模型
  #                         （core/permissions/jev_reviewer.py）—— 它**不生成文本**，
  #                         直接返回带概率的结构化判定（Choice/Score/Noul），
  #                         reason 由代码按数值拼出，比自由文本更可复查。
  #            llm        = 调 chat 模型 + 解析 JSON 输出
  #                         （core/permissions/reviewer.py）—— 显式可选，不是默认。
  #                         ⚠️ 它会跟主对话**抢同一个 provider 额度**（实测撞过 429）。
  # ⚠️ Jev 实测延迟 1.2–9.7s（偶发 >90s）—— 审查阻塞在工具执行路径上，所以超时
  #    默认 15s，超时一律按拒绝处理（fail-closed）。
  # ⚠️ **Jev 不可用时不会回落到 llm**（api_key 缺失 / 构造失败）：本次不启用审批审查，
  #    `REVIEW` 档会**降级为 deny_all**（变严，不会误放行），并在启动时明确告警。
  #    要用 LLM 后端就**显式**写 backend: llm。
  # ⚠️ 真实 key 不要写进本文件（**本文件进版本控制**）—— 写 config.yaml，它已被
  #    .gitignore 忽略。key 从 console.typesafe.ai 获取。
  approval_review:
    backend: "jev"
    jev:
      url: "https://api.typesafe.ai/v1/systemone"
      api_key: ""            # 留空 = 不启用审批审查（**不会**自动改用 llm）
      model: "jev-latest"
      timeout_s: 15

# ── Agent 循环策略 ──
# "react"（默认）或自定义模块路径（spec_loop）
loop: ""
