# CodeForge — 多协议 LLM 终端对话客户端
#
# providers: LLM 服务提供商列表，可配置多项
#   每项字段说明：
#     - name:      可读名称（如 "My Claude"），用于界面显示
#     - protocol:  协议类型，"anthropic" 或 "openai"
#     - model:     模型名（如 "claude-sonnet-4-20250514", "gpt-4o"）
#     - api_key:   API 密钥（必填）
#     - base_url:  自定义端点地址（可选，覆盖协议默认端点）
#     - thinking:  是否开启扩展思考（可选，默认 false，仅 anthropic 协议生效）

providers:
  - name: "Anthropic"
    protocol: anthropic
    model: "deepseek-v4-flash"
    api_key: "sk-e209b57e53cb4a9ca3e296122ff249c9"
    base_url: "https://api.deepseek.com/anthropic"
    thinking: true

  - name: "OpenAI"
    protocol: openai
    model: "deepseek-v4-pro"
    api_key: "sk-e209b57e53cb4a9ca3e296122ff249c9"
    base_url: "https://api.deepseek.com"
    thinking: true
