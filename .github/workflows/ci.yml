name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # 一个平台挂了不要连带取消其他平台 —— 我们需要看到完整的红绿分布
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 走 `.[dev]`：包发现规则在 pyproject 的 [tool.setuptools] 里显式声明，
      # 这一步同时验证"项目能装" —— 安装本身曾经是坏的，值得每次 CI 都跑一遍。
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint & format
        run: |
          ruff check
          ruff format --check

      - name: Type check (whitelist)
        run: mypy

      - name: Smoke test the entry points
        run: |
          codeforge --help
          codeforge-bench --help

      - name: Run tests
        run: python -m pytest -q
